      border-radius: 10px;
      background: rgba(248,250,252,0.92);

    .menu-link {

      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 16px;

      background: transparent;
      color: #475569;
      font-size: 13px;

    .menu-link.active {

    .stage {

    .accent-ui { fill: var(--ui); }

    .title { fill: var(--ink); font-size: 14px; font-weight: 750; }

        tag:['INPUT','Transcripts (III), MWU defs &amp; AS-units (researcher), pauses (I)','OUTPUT','Lexical / MWU · clause · pause · rate tables → Phase V'] },
      { roman:'V', accent:'#15803d', kicker:'Phase V', name:'Database Synthesis &amp; Research Export',
        title:'Phase V — Database Synthesis &amp; Research Export',
        layer:'Layer 3', lcolor:'#6d28d9',
        sub:'Every upstream artifact plus researcher metadata is merged into a long-format research workbook and an analysis-ready matrix, validated against gold samples and signed off for publication. Early merge sits in Layer 2; full validation, reporting and sign-off are Layer 3.',
        tag:['INPUT','All upstream outputs + metadata workbook (researcher)','OUTPUT','Research workbook .xlsx + analysis matrix .csv'] }
    ];

    const navEl = document.getElementById('nav');
    const views = [...document.querySelectorAll('.view')];
    const docTitle = document.getElementById('docTitle');
    const docSub = document.getElementById('docSub');
    const docTag = document.getElementById('docTag');

    PHASES.forEach((p, i) =&gt; {
      const b = document.createElement('button');
      b.className = 'nav-item';
      b.style.setProperty('--accent', p.accent);
      b.innerHTML =
        '&lt;span class=&quot;roman&quot;&gt;' + p.roman + '&lt;/span&gt;' +
        '&lt;span class=&quot;nav-meta&quot;&gt;&lt;span class=&quot;nav-kicker&quot;&gt;' + p.kicker + '&lt;/span&gt;' +
        '&lt;span class=&quot;nav-title&quot;&gt;' + p.name + '&lt;/span&gt;&lt;/span&gt;';
      b.addEventListener('click', () =&gt; select(i));
      navEl.appendChild(b);
    });

    function select(idx) {
      const p = PHASES[idx];
      [...navEl.children].forEach((c, i) =&gt; c.classList.toggle('active', i === idx));
      views.forEach((v, i) =&gt; v.classList.toggle('active', i === idx));
      docTitle.textContent = p.title;
      docSub.textContent = p.sub;
      document.documentElement.style.setProperty('--accent', p.accent);
      docTag.style.setProperty('--accent', p.accent);
      docTag.innerHTML =
        '&lt;strong&gt;QUOTE TIER&lt;/strong&gt;&lt;span class=&quot;layer-pill&quot; style=&quot;background:' + p.lcolor + '&quot;&gt;' + p.layer + '&lt;/span&gt;' +
        '&lt;strong style=&quot;margin-top:8px&quot;&gt;INPUT&lt;/strong&gt;' + p.tag[1] +
        '&lt;strong style=&quot;margin-top:8px&quot;&gt;OUTPUT&lt;/strong&gt;' + p.tag[3];
      location.hash = 'phase-' + p.roman;
    }

    const startRoman = (location.hash.replace('#phase-', '') || 'I').toUpperCase();
    const startIdx = PHASES.findIndex(p =&gt; p.roman === startRoman);
    select(startIdx === -1 ? 0 : startIdx);
  &lt;/script&gt;

&lt;body&gt;
  &lt;main class=&quot;shell&quot;&gt;
    &lt;header&gt;
      &lt;div&gt;
        &lt;p class=&quot;eyebrow&quot;&gt;Commercial scope proposal&lt;/p&gt;
        &lt;h1&gt;Delivery plan for the MWU Fluency Pipeline&lt;/h1&gt;
        &lt;p class=&quot;lede&quot;&gt;The research workflow runs from Phase I to Phase V. The commercial delivery should be separated into a small Validation Sprint and layered delivery tiers, so each commitment has a clear acceptance gate, dependency boundary, and risk profile.&lt;/p&gt;
      &lt;/div&gt;
      &lt;aside class=&quot;summary-card&quot;&gt;
        &lt;b&gt;Recommended path&lt;/b&gt;
        &lt;p&gt;Start with the monologue benchmark, then fund the highest-labor annotation layer, then add research analysis and final reporting only after definitions and gold standards are signed off.&lt;/p&gt;
      &lt;/aside&gt;
    &lt;/header&gt;

    &lt;section class=&quot;grid&quot; aria-label=&quot;Delivery tiers&quot;&gt;
      &lt;article class=&quot;tier&quot; style=&quot;--accent: var(--sprint)&quot;&gt;
        &lt;div class=&quot;tier-label&quot;&gt;&lt;span&gt;Pre-layer&lt;/span&gt;&lt;strong&gt;VS&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tier-body&quot;&gt;
          &lt;h2&gt;Validation Sprint - monologue benchmark&lt;/h2&gt;
          &lt;p&gt;Purpose: prove that the software can reproduce the provided expert Praat/TextGrid/Excel baseline before committing to the real multilogue pipeline.&lt;/p&gt;
          &lt;div class=&quot;cols&quot;&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Covers&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Phase II gold replay&lt;/li&gt;
                &lt;li&gt;Phase III transcript split test&lt;/li&gt;
                &lt;li&gt;Phase V matrix skeleton&lt;/li&gt;
                &lt;li&gt;Net-new local WebUI validation console&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Deliverables&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Input manifest and method log&lt;/li&gt;
                &lt;li&gt;0.25 / 0.35 threshold artifacts&lt;/li&gt;
                &lt;li&gt;RAW and TIDY transcript files&lt;/li&gt;
                &lt;li&gt;Validation report and matrix skeleton&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Acceptance&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Pause count matches exactly&lt;/li&gt;
                &lt;li&gt;Key durations match within 0.001 s&lt;/li&gt;
                &lt;li&gt;0.25 SpeakerX matrix matches baseline&lt;/li&gt;
                &lt;li&gt;0.35 clearly marked as no-gold&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Boundary&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Monologue only&lt;/li&gt;
                &lt;li&gt;No diarization validation&lt;/li&gt;
                &lt;li&gt;No final lexical/MWU analysis&lt;/li&gt;
                &lt;li&gt;Deductible only within agreed window&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;p style=&quot;margin-top:14px&quot;&gt;Workbook check: the supplied SpeakerX workbook has no separate 0.35 threshold gold columns; 0.35 is generated for schema and process verification only until the research team supplies a matching gold baseline.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;tier&quot; style=&quot;--accent: var(--l1)&quot;&gt;
        &lt;div class=&quot;tier-label&quot;&gt;&lt;span&gt;Layer 1a&lt;/span&gt;&lt;strong&gt;L1a&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tier-body&quot;&gt;
          &lt;h2&gt;AI diarization and speaker isolation&lt;/h2&gt;
          &lt;p&gt;Purpose: process real multilogue recordings by proposing speaker turns and producing per-speaker muted-mirror audio for later Praat processing.&lt;/p&gt;
          &lt;div class=&quot;cols&quot;&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Covers&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Phase I&lt;/li&gt;
                &lt;li&gt;Configurable speaker count&lt;/li&gt;
                &lt;li&gt;AI speaker diarization&lt;/li&gt;
                &lt;li&gt;Muted-mirror WAV generation&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Deliverables&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Diarization JSON&lt;/li&gt;
                &lt;li&gt;Per-speaker audio files&lt;/li&gt;
                &lt;li&gt;Review TextGrid draft&lt;/li&gt;
                &lt;li&gt;Correction-rate report&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Acceptance&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Measured against client gold cuts&lt;/li&gt;
                &lt;li&gt;Speaker error and edit rate reported&lt;/li&gt;
                &lt;li&gt;Overlaps and uncertainty surfaced&lt;/li&gt;
                &lt;li&gt;Human correction remains expected&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Risk&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Probabilistic AI component&lt;/li&gt;
                &lt;li&gt;Sprint does not validate this layer&lt;/li&gt;
                &lt;li&gt;Depends on real multilogue samples&lt;/li&gt;
                &lt;li&gt;Overlapping speech may require manual correction&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;tier&quot; style=&quot;--accent: var(--l1b)&quot;&gt;
        &lt;div class=&quot;tier-label&quot;&gt;&lt;span&gt;Layer 1b&lt;/span&gt;&lt;strong&gt;L1b&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tier-body&quot;&gt;
          &lt;h2&gt;Deterministic Praat automation&lt;/h2&gt;
          &lt;p&gt;Purpose: reduce the most repetitive Praat pause-boundary and duration-calculation work with configurable, reviewable, Praat-compatible outputs.&lt;/p&gt;
          &lt;div class=&quot;cols&quot;&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Covers&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Phase II core&lt;/li&gt;
                &lt;li&gt;Configurable pause thresholds&lt;/li&gt;
                &lt;li&gt;Praat CLI / TextGrid generation&lt;/li&gt;
                &lt;li&gt;Duration calculations&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Deliverables&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Threshold-specific TextGrids&lt;/li&gt;
                &lt;li&gt;Segment duration tables&lt;/li&gt;
                &lt;li&gt;Review-ready artifacts&lt;/li&gt;
                &lt;li&gt;Parameter and version logs&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Acceptance&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Full unsegmented timeline preserved&lt;/li&gt;
                &lt;li&gt;Gold-sample count and duration error reported&lt;/li&gt;
                &lt;li&gt;Parameters adjustable without code changes&lt;/li&gt;
                &lt;li&gt;Manual Praat review remains final&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Risk&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Deterministic and controllable&lt;/li&gt;
                &lt;li&gt;Calculation chain tested in Sprint&lt;/li&gt;
                &lt;li&gt;Does not depend on cloud ASR&lt;/li&gt;
                &lt;li&gt;Still needs human review of difficult acoustic cases&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;tier&quot; style=&quot;--accent: var(--l2)&quot;&gt;
        &lt;div class=&quot;tier-label&quot;&gt;&lt;span&gt;Layer 2&lt;/span&gt;&lt;strong&gt;L2&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tier-body&quot;&gt;
          &lt;h2&gt;Research analysis expansion&lt;/h2&gt;
          &lt;p&gt;Purpose: add the transcript, AS-unit, pause-location, lexical and MWU analysis needed to answer the research questions, once definitions are stable.&lt;/p&gt;
          &lt;div class=&quot;cols&quot;&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Covers&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Phase III&lt;/li&gt;
                &lt;li&gt;Phase IV&lt;/li&gt;
                &lt;li&gt;Early Phase V integration&lt;/li&gt;
                &lt;li&gt;Optional word-level alignment add-on&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Deliverables&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;RAW-TIMING and TIDY-PHRASE files&lt;/li&gt;
                &lt;li&gt;AS-unit / clause mapping tables&lt;/li&gt;
                &lt;li&gt;Lexical and MWU feature tables&lt;/li&gt;
                &lt;li&gt;Pause-location features&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Start condition&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;AS-unit rules signed off&lt;/li&gt;
                &lt;li&gt;MWU definition signed off&lt;/li&gt;
                &lt;li&gt;Syllable / repair coding rules signed off&lt;/li&gt;
                &lt;li&gt;Gold examples supplied&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;MFA boundary&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Base scope uses reviewed silence and clause boundaries&lt;/li&gt;
                &lt;li&gt;MFA adds word-level timing precision&lt;/li&gt;
                &lt;li&gt;MFA is separately quoted and validated&lt;/li&gt;
                &lt;li&gt;No word-level claim without alignment evidence&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;tier&quot; style=&quot;--accent: var(--l3)&quot;&gt;
        &lt;div class=&quot;tier-label&quot;&gt;&lt;span&gt;Layer 3&lt;/span&gt;&lt;strong&gt;L3&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;tier-body&quot;&gt;
          &lt;h2&gt;Final matrix and reporting system&lt;/h2&gt;
          &lt;p&gt;Purpose: turn reviewed outputs and research features into a stable final workbook, codebook, validation package and reporting workflow.&lt;/p&gt;
          &lt;div class=&quot;cols&quot;&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Covers&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Full Phase V&lt;/li&gt;
                &lt;li&gt;Cross-phase synthesis&lt;/li&gt;
                &lt;li&gt;Final export schema&lt;/li&gt;
                &lt;li&gt;Reporting workflow&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Deliverables&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Research workbook&lt;/li&gt;
                &lt;li&gt;Analysis matrix CSV/XLSX&lt;/li&gt;
                &lt;li&gt;Codebook and method log&lt;/li&gt;
                &lt;li&gt;Validation dashboard/report&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Acceptance&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Schema signed off&lt;/li&gt;
                &lt;li&gt;Gold validation reported&lt;/li&gt;
                &lt;li&gt;Traceability from source to metric&lt;/li&gt;
                &lt;li&gt;Publication/archive package complete&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;box&quot;&gt;
              &lt;h3&gt;Boundary&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Statistical modeling is separate&lt;/li&gt;
                &lt;li&gt;Final research interpretation remains researcher-owned&lt;/li&gt;
                &lt;li&gt;Requires stable upstream outputs&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;
    &lt;/section&gt;

    &lt;section class=&quot;notice&quot; aria-label=&quot;Scope guardrails&quot;&gt;
      &lt;article class=&quot;notice-card&quot;&gt;
        &lt;h2&gt;Claims boundary&lt;/h2&gt;
        &lt;p&gt;&lt;span class=&quot;tag&quot;&gt;&lt;i class=&quot;dot&quot; style=&quot;--accent: var(--sprint)&quot;&gt;&lt;/i&gt;Validation Sprint&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;&lt;i class=&quot;dot&quot; style=&quot;--accent: var(--l1)&quot;&gt;&lt;/i&gt;Layer 1a risk&lt;/span&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;The sprint validates the deterministic calculation chain, not AI speaker diarization.&lt;/li&gt;
          &lt;li&gt;AI diarization must be validated later against multilogue gold samples, with correction/error rates reported.&lt;/li&gt;
          &lt;li&gt;Praat-reviewed TextGrid files remain the final research evidence, not unreviewed AI output.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
      &lt;article class=&quot;notice-card&quot;&gt;
        &lt;h2&gt;Client inputs required&lt;/h2&gt;
        &lt;p&gt;&lt;span class=&quot;tag&quot;&gt;&lt;i class=&quot;dot&quot; style=&quot;--accent: var(--l2)&quot;&gt;&lt;/i&gt;Definitions sign-off&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;&lt;i class=&quot;dot&quot; style=&quot;--accent: var(--l3)&quot;&gt;&lt;/i&gt;Gold standards&lt;/span&gt;&lt;/p&gt;

          &lt;li&gt;For L1a: multilogue audio plus manual speaker-isolation gold examples.&lt;/li&gt;

  </main>

  <script>
    const buttons = [...document.querySelectorAll('.menu-link')];
    const frames = {
      workflow: document.getElementById('workflowFrame'),
      proposal: document.getElementById('proposalFrame')
    };
    const statusText = {
      workflow: ['Five-phase atlas', 'Phase I-V delivery flow'],
      proposal: ['Scope summary', 'Pricing-stage boundaries']
    };
    function select(page, push = true) {
      const next = frames[page] ? page : 'workflow';
      buttons.forEach((button) => {
        const active = button.dataset.page === next;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
      Object.entries(frames).forEach(([key, frame]) => frame.classList.toggle('active', key === next));
      document.getElementById('statusTitle').textContent = statusText[next][0];
      document.getElementById('statusSub').textContent = statusText[next][1];
      if (push) history.replaceState(null, '', '#' + next);
    }
    buttons.forEach((button) => button.addEventListener('click', () => select(button.dataset.page)));
    select((location.hash || '#workflow').slice(1), false);
  </script>
